<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens flexíveis</title>
</head>
<body>
    <h1>Imagens</h1>
    <p>Abaixo temos imagens que se adaptam sozinhas ao tamanho da tela</p>
    <picture>
        <source media="(max-width: 800px)" srcset="paisagem-p.png" type="image/png">
        <source media="(max-width: 1250px)" srcset="paisagem-m.png" type="image/png">
        <img src="paisagem-g.png" alt="Imagem de garota no monte">
    </picture>
</body>
</html>
